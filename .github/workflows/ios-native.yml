# Benten natif — app iOS en SwiftUI, compilée sans Mac.
#
# POURQUOI
# La version Capacitor (page web emballée) s'est heurtée à la permission « Réseau local » d'iOS et
# n'apportait pas le comportement d'une vraie app. Cette cible est une app NATIVE :
#   - SwiftUI (interface iOS authentique) ;
#   - AVFoundation + AVAudioSession `.playback` : lecture écran verrouillé et en arrière-plan ;
#   - MPNowPlayingInfoCenter : pochette et titre sur l'écran verrouillé, commandes du casque ;
#   - pochettes réellement extraites des fichiers audio (AVAsset metadata) ;
#   - import depuis Fichiers / iCloud (UIDocumentPicker), stockage dans le dossier de l'app.
#
# Le projet Xcode est GÉNÉRÉ par XcodeGen à partir de `project.yml` : pas de `.pbxproj` à maintenir.
# Aucune signature n'est appliquée : le .ipa est signé ensuite par AltStore/AltServer.

name: iOS natif — ipa non signé

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Générer le projet Xcode
        working-directory: ios-native
        run: |
          xcodegen generate
          ls -la

      - name: Compiler (sans signature)
        working-directory: ios-native
        run: |
          # `pipefail` : sans lui, un echec de xcodebuild etait masque par le `tail` qui suit,
          # et l'etape paraissait verte alors que rien n'avait ete compile.
          set -o pipefail
          xcodebuild \
            -project Benten.xcodeproj \
            -scheme Benten \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | tail -n 200

      - name: Empaqueter le .ipa
        run: |
          APP=$(find ios-native/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App : $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry benten-native-unsigned.ipa Payload
          ls -lh benten-native-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: benten-native-ipa
          path: out/benten-native-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

