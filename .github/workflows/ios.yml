# Compilation du .ipa Benten — sans Mac, sur les machines macOS de GitHub.
#
# POURQUOI CE FICHIER
# Une app iOS se compile avec Xcode, qui n'existe que sur macOS. GitHub Actions met à disposition
# des runners macOS gratuits : ce workflow y construit un .ipa NON SIGNÉ, que tu installes ensuite
# avec le même outil que tes autres apps (AltStore, Sideloadly, ESign…).
#
# UTILISATION
#   1. pousser ce dépôt sur GitHub (compte gratuit suffit) ;
#   2. onglet « Actions » ▸ « iOS — ipa non signé » ▸ « Run workflow » ;
#   3. télécharger l'artefact `benten-ios-ipa` quand il est vert ;
#   4. signer/installer le .ipa avec ton outil habituel.
#
# RIEN N'EST SIGNÉ ICI : aucune clé, aucun certificat, aucun identifiant Apple ne transite.

name: iOS — ipa non signé

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer CocoaPods
        run: |
          brew install cocoapods
          pod --version

      - name: Dépendances de l'enveloppe
        working-directory: ios
        run: npm install --no-audit --no-fund

      - name: Créer le projet Xcode (première fois)
        working-directory: ios
        run: |
          if [ ! -d ios/App ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Autoriser le réseau local dans Info.plist
        run: |
          # Deux blocages iOS sans ça, et la synchronisation serait morte dans l'app :
          #  - ATS refuse le HTTP en clair vers le PC (http://192.168.x.x) ;
          #  - iOS 14+ exige une autorisation explicite « réseau local ».
          # On autorise UNIQUEMENT le réseau local, pas tout le trafic non chiffré.
          PLIST=ios/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" 2>/dev/null || true
          # NSAllowsLocalNetworking ne suffit pas toujours : WebKit refuse encore le clair vers
          # une IP privee dans une WebView Capacitor (erreur « Load failed »). On autorise donc
          # le HTTP en clair pour CETTE app seulement : elle ne parle qu au PC de l utilisateur.
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
          # iOS n'affiche « Réseau local » dans Réglages QUE si l'app a déclenché une demande.
          # Déclarer un service Bonjour force cette demande au premier lancement — c'est le
          # seul moyen d'obtenir l'interrupteur quand la requête HTTP seule ne le déclenche pas.
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _benten._tcp" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Benten se connecte a votre ordinateur sur le reseau local pour recuperer vos morceaux.'" "$PLIST" 2>/dev/null || true
          # Lecture en arriere-plan / ecran verrouille (comme Apple Music) : il faut declarer
          # le mode "audio", sinon iOS met la musique en pause des que l'app passe en fond.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          # Barre d'etat claire (texte blanc) sur le fond sombre, plein ecran.
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Forcer la fenetre "Reseau local" (declencheur natif)
        run: |
          # Bug connu : une WebView Capacitor qui appelle une IP privee ne declenche
          # PAS toujours la demande d'autorisation "Reseau local" d'iOS 14+. Sans cette
          # demande, aucun interrupteur n'apparait dans Reglages et la requete est bloquee
          # en silence. On ajoute donc un NWBrowser Bonjour au demarrage : le simple fait
          # de le lancer force iOS a afficher la fenetre "... souhaite trouver des appareils
          # sur votre reseau local". L'utilisateur touche Autoriser, et la synchro passe.
          python3 - <<'PY'
          import sys
          p = "ios/ios/App/App/AppDelegate.swift"
          s = open(p, encoding="utf-8").read()
          if "import Network" not in s:
              s = s.replace("import Capacitor", "import Capacitor\nimport Network", 1)
          if "import AVFoundation" not in s:
              s = s.replace("import Capacitor", "import Capacitor\nimport AVFoundation", 1)
          if "bentenBrowser" not in s:
              s = s.replace("var window: UIWindow?",
                            "var window: UIWindow?\n    var bentenBrowser: NWBrowser?", 1)
          anchor = "// Override point for customization after application launch."
          if "browser.start" not in s and anchor in s:
              trigger = (anchor
                  + "\n        // Lecture en arriere-plan / ecran verrouille (comme Apple Music) :"
                  + "\n        // categorie lecture + session activee (indispensable pour que le son"
                  + "\n        // continue quand l'ecran se verrouille)."
                  + "\n        try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)"
                  + "\n        try? AVAudioSession.sharedInstance().setActive(true)"
                  + "\n        let browser = NWBrowser(for: .bonjour(type: \"_benten._tcp\", domain: \"local.\"), using: NWParameters())"
                  + "\n        browser.stateUpdateHandler = { _ in }"
                  + "\n        browser.start(queue: .main)"
                  + "\n        self.bentenBrowser = browser")
              s = s.replace(anchor, trigger, 1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          if "browser.start" not in s:
              sys.exit("ERREUR: declencheur reseau local non injecte (AppDelegate inattendu)")
          PY

      - name: Icone d'application (logo Benten)
        run: |
          # Remplace l'icone generee par defaut par le logo Benten (sceau dore + B serif).
          # Capacitor 6 range l'icone dans AppIcon.appiconset ; on ecrase tous ses PNG.
          ICONSET=$(find ios/ios/App -type d -name "AppIcon.appiconset" | head -n 1)
          echo "appiconset: $ICONSET"
          if [ -n "$ICONSET" ] && [ -f ios/appicon-1024.png ]; then
            count=0
            for f in "$ICONSET"/*.png; do cp ios/appicon-1024.png "$f"; count=$((count+1)); done
            echo "icones remplacees: $count"
          else
            echo "ATTENTION: appiconset ou logo introuvable, icone par defaut conservee"
          fi

      - name: Compiler (sans signature)
        working-directory: ios/ios/App
        run: |
          # `CODE_SIGNING_ALLOWED=NO` : on veut un binaire brut, la signature sera faite
          # par l'outil d'installation. `-derivedDataPath` garde l'artefact à un endroit connu.
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Empaqueter le .ipa
        run: |
          APP_PATH=$(find ios/ios/App/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 2 | head -n 1)
          echo "App : $APP_PATH"
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          # Un .ipa n'est qu'un zip dont la racine contient Payload/<App>.app
          zip -qry benten-unsigned.ipa Payload
          ls -lh benten-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: benten-ios-ipa
          path: out/benten-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

