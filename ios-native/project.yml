name: Benten
options:
  bundleIdPrefix: com.benten
  # Format de projet compatible Xcode 15 : XcodeGen ecrit du format 77 (Xcode 16) par defaut,
  # que le Xcode du runner ne sait pas ouvrir (« project file format (77) »).
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Benten:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benten.player
        PRODUCT_NAME: Benten
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Info.plist généré par Xcode : moins de fichiers, moins d'erreurs en CI.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Benten
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Lecture en arrière-plan : indispensable pour écouter écran verrouillé.
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Le réseau local n'est utilisé que pour la synchronisation optionnelle avec le PC.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Benten se connecte à votre ordinateur sur le réseau local pour récupérer votre musique."
        INFOPLIST_KEY_NSBonjourServices: _benten._tcp
        # La synchronisation passe par http:// sur le réseau local : iOS exige cette exception.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        CODE_SIGNING_ALLOWED: NO

