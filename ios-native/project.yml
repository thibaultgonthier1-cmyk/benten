name: Benten
options:
  bundleIdPrefix: com.benten
  # Format de projet compatible Xcode 15 : XcodeGen ecrit du format 77 (Xcode 16) par defaut,
  # que le Xcode du runner ne sait pas ouvrir (« project file format (77) »).
  xcodeVersion: "15.4"
  deploymentTarget:
    # iOS 16 : NavigationStack, LabeledContent et .topBarTrailing en dependent.
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Benten:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benten.player
        PRODUCT_NAME: Benten
        # 2.x : l'app native remplace la coquille Capacitor (meme bundle id). Un numero plus eleve
        # evite qu'iOS refuse l'installation en la prenant pour la meme version.
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Info.plist fourni a la main : les INFOPLIST_KEY_* ne savent pas ecrire les tableaux
        # (UIBackgroundModes, NSBonjourServices) ni les dictionnaires (ATS) — ils disparaissaient
        # du paquet sans erreur.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGNING_ALLOWED: NO


