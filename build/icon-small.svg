  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="#0a0908" />
  <circle cx="512" cy="470" r="250" fill="url(#gold)" />
  <g stroke="#f3efe8" stroke-linecap="round" fill="none">
    <path d="M150 268 Q512 350 874 268" stroke-width="112" />
    <path d="M170 596 H854" stroke-width="104" />
    <path d="M296 380 V846" stroke-width="106" />
